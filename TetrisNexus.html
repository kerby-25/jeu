<!doctype html>
<html lang="fr">
<head>

<title>TETRIS NEXUS</title>
<style>
:root{color-scheme:dark;--bg:#080b12;--blue:#1769ff;--blue2:#4e91ff;--blue3:#9fc4ff;--white:#fff}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050810;font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--white);overscroll-behavior:none}
body{display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 35%,#101c35 0%,#080d18 45%,#03050a 100%)}
#wrap{width:min(100vw,177.7778vh);height:min(100vh,56.25vw);position:relative;overflow:hidden;box-shadow:0 0 90px #1769ff24}

@media (pointer:coarse) and (orientation:portrait){#wrap{width:100vw;height:100vh;height:100dvh}}

<body>
<div id="wrap"><canvas id="game" width="1280" height="720" tabindex="0" aria-label="Tetris Nexus"></canvas><div id="hint">TETRIS NEXUS • BUILD AUTONOME</div></div>
<script>
(() => {
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const W=1280,H=720,COLS=10,ROWS=22,VISIBLE=20,CELL=27,BOARD_X=490,BOARD_Y=76;
let mobilePortrait=false,mobileH=1558,mobileHitAreas=[],activeTouchControls=new Map();
function resizeGameCanvas(){const touch=('ontouchstart' in window)||navigator.maxTouchPoints>0;mobilePortrait=touch&&window.innerWidth<window.innerHeight&&window.innerWidth<800;if(mobilePortrait){mobileH=Math.max(1100,Math.round(720*window.innerHeight/window.innerWidth));canvas.width=720;canvas.height=mobileH;}else{canvas.width=W;canvas.height=H;}ctx.setTransform(1,0,0,1,0,0);}
resizeGameCanvas();window.addEventListener('resize',resizeGameCanvas);window.addEventListener('orientationchange',()=>setTimeout(resizeGameCanvas,120));
const C={bg:'#080b12',panel:'#0d1525',panel2:'#111e35',blue:'#1769ff',blue2:'#4e91ff',blue3:'#9fc4ff',gold:'#d4af37',gold2:'#f4d675',white:'#ffffff',muted:'#8ea8d2',line:'#20375d',deep:'#0a1020'};
const PIECES={
 I:[[0,1],[1,1],[2,1],[3,1]], O:[[1,0],[2,0],[1,1],[2,1]], T:[[1,0],[0,1],[1,1],[2,1]],
 S:[[1,0],[2,0],[0,1],[1,1]], Z:[[0,0],[1,0],[1,1],[2,1]], J:[[0,0],[0,1],[1,1],[2,1]], L:[[2,0],[0,1],[1,1],[2,1]]
};
const PIECE_COLORS={I:'#9fc4ff',O:'#4e91ff',T:'#1769ff',S:'#6da7ff',Z:'#2e7eff',J:'#b9d5ff',L:'#397cff'};
const BASE_POINTS=[0,100,300,500,800],ENERGY_GAIN=[0,20,50,90,140];
const COST={pulse:120,stasis:100,laser:180,shield:220};
const MISSIONS=[
 {name:'Premier contact',subtitle:'Rétablir le flux initial',goal:'Effacer 8 lignes',type:'lines',target:8,brief:'Apprenez à placer les sept tétriminos et à libérer les premières lignes.'},
 {name:'Signal fort',subtitle:'Stabiliser le relais',goal:'Atteindre 2 500 points',type:'score',target:2500,brief:'Enchaînez les suppressions pour augmenter votre score et votre réserve.'},
 {name:'Impulsion',subtitle:'Maîtriser l’énergie',goal:'Activer Pulse une fois',type:'pulse',target:1,brief:'La capacité Pulse détruit une zone de 3 × 3, sauf les blocs gelés et indestructibles.'},
 {name:'Synchronisation',subtitle:'Tenir la cadence',goal:'Survivre 90 secondes',type:'time',target:90,brief:'Conservez une grille stable pendant 90 secondes. La vitesse augmente avec le niveau.'},
 {name:'Le Verrou',subtitle:'Affrontement du gardien',goal:'Réduire la résistance du boss à zéro',type:'boss',target:12,brief:'Le Verrou lance une rangée de pression annoncée. Le Bouclier peut annuler une attaque.'}
];
const STORE='tetrisNexusSave_v1';
let save={classicBest:0,survivalBest:0,dailyBest:0,stars:[0,0,0,0,0],options:{sfx:true,sfxVolume:.65,music:false,musicVolume:.18,reduced:false}};
try{const s=JSON.parse(localStorage.getItem(STORE)||'null');if(s&&typeof s==='object'){save={...save,...s,options:{...save.options,...(s.options||{})}};if(!Array.isArray(save.stars))save.stars=[0,0,0,0,0];}}catch(e){}
function persist(){try{localStorage.setItem(STORE,JSON.stringify(save));}catch(e){}}
let screen='menu',game=null,menuIndex=0,modeIndex=0,missionIndex=0,resultData=null,toast='',toastTimer=0,animT=0,lastFrame=0;
let audioCtx=null,musicNodes=null;
function sound(freq=440,duration=.07,wave='sine',vol=.035){if(!save.options.sfx||save.options.sfxVolume<=0)return;vol*=save.options.sfxVolume;try{audioCtx ||= new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=wave;o.frequency.value=freq;g.gain.setValueAtTime(vol,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+duration);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+duration);}catch(e){}}
function stopMusic(){if(!musicNodes)return;clearInterval(musicNodes.timer);for(const n of musicNodes.nodes){try{n.stop();}catch(e){}}musicNodes=null;}
async function toggleMusic(on){save.options.music=on;persist();try{audioCtx ||= new (window.AudioContext||window.webkitAudioContext)();if(on){await audioCtx.resume();if(musicNodes)return;const notes=[110,164.81,220,164.81,130.81,196,261.63,196,146.83,220,293.66,220,130.81,196,246.94,196];let step=0;const nodes=[];const playNote=()=>{if(!audioCtx||audioCtx.state!=='running')return;const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.type='triangle';osc.frequency.value=notes[step++%notes.length];gain.gain.setValueAtTime(0.0001,audioCtx.currentTime);gain.gain.linearRampToValueAtTime(Math.max(.012,save.options.musicVolume*.16),audioCtx.currentTime+.035);gain.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+.38);osc.connect(gain);gain.connect(audioCtx.destination);osc.start();osc.stop(audioCtx.currentTime+.4);nodes.push(osc);if(nodes.length>24)nodes.shift();};playNote();musicNodes={nodes,timer:setInterval(playNote,390)};}else stopMusic();}catch(e){say('AUDIO INDISPONIBLE : CLIQUEZ DANS LE JEU PUIS RÉACTIVEZ LA MUSIQUE');}}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function rand(n){return Math.floor(Math.random()*n);}
function makeRng(seed){let x=seed>>>0;return()=>{x=(x+0x6D2B79F5)>>>0;let t=x;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return ((t^(t>>>14))>>>0)/4294967296;};}
function todaySeed(){const d=new Date();return Number(`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`);}
function createBag(g){const bag=['I','O','T','S','Z','J','L'];for(let i=bag.length-1;i>0;i--){const j=Math.floor(g.rng()*(i+1));[bag[i],bag[j]]=[bag[j],bag[i]];}return bag;}
function nextType(g){if(!g.bag.length)g.bag=createBag(g);return g.bag.pop();}
function rotateCoords(type,rot){let p=PIECES[type].map(([x,y])=>[x,y]);for(let r=0;r<rot%4;r++)p=p.map(([x,y])=>[3-y,x]);let minX=Math.min(...p.map(v=>v[0])),minY=Math.min(...p.map(v=>v[1]));return p.map(([x,y])=>[x-minX,y-minY]);}
function newPiece(g,type=null){const t=type||nextType(g);let special=null;if(g.mode==='survival'&&g.level>=2&&g.rng()<.15){const r=g.rng();special=r<.38?'explosive':r<.66?'frozen':r<.84?'crystal':'indestructible';}return {type:t,rot:0,x:3,y:0,special};}
function freshBoard(){return Array.from({length:ROWS},()=>Array(COLS).fill(null));}
function newGame(mode,mission=0){const seed=mode==='daily'?todaySeed():((Date.now()^Math.floor(Math.random()*0xffffffff))>>>0);const rng=makeRng(seed);
 game={mode,mission,seed,rng,bag:[],board:freshBoard(),active:null,next:[],hold:null,holdUsed:false,score:0,lines:0,level:1,combo:0,energy:mode==='campaign'?(mission===2?150:mission===4?100:0):0,
 time:0,dropClock:0,softClock:0,held:{},moveClock:0,stasis:0,shield:false,targetMode:null,targetX:4,targetY:10,usedPulse:0,bossHp:mission===4?12:0,bossMax:mission===4?12:0,bossClock:0,bossWarning:false,event:null,eventClock:0,eventDuration:0,eventMessage:'',eventBanner:0,gameOver:false,won:false,startedAt:performance.now(),lastLock:0,particles:[],specialsEnabled:mode==='survival',shake:0};
 for(let i=0;i<5;i++)game.next.push(nextType(game));spawnPiece();screen='playing';resultData=null;sound(520,.08);}
function spawnPiece(){if(!game)return;const t=game.next.shift();game.next.push(nextType(game));game.active=newPiece(game,t);game.holdUsed=false;if(!valid(game.active,game.active.x,game.active.y,game.active.rot)){finishGame(false,'La zone d’apparition est bloquée.');}}
function valid(p,x,y,rot){for(const [cx,cy] of rotateCoords(p.type,rot)){const gx=x+cx,gy=y+cy;if(gx<0||gx>=COLS||gy>=ROWS)return false;if(gy>=0&&game.board[gy][gx])return false;}return true;}
function tryMove(dx,dy){if(!game||screen!=='playing'||game.targetMode)return false;const p=game.active;if(valid(p,p.x+dx,p.y+dy,p.rot)){p.x+=dx;p.y+=dy;return true;}return false;}
function tryRotate(dir){if(!game||screen!=='playing'||game.targetMode)return;const p=game.active,n=(p.rot+dir+4)%4;const kicks=[[0,0],[-1,0],[1,0],[-2,0],[2,0],[0,-1]];for(const [kx,ky] of kicks){if(valid(p,p.x+kx,p.y+ky,n)){p.x+=kx;p.y+=ky;p.rot=n;sound(320,.045);return;}}}
function hardDrop(){if(!game||screen!=='playing'||game.targetMode)return;let d=0;while(valid(game.active,game.active.x,game.active.y+1,game.active.rot)){game.active.y++;d++;}game.score+=d*2;lockPiece();sound(180,.11,'triangle');}
function softStep(){if(tryMove(0,1)){game.score+=1;game.dropClock=0;}else lockPiece();}
function holdPiece(){if(!game||screen!=='playing'||game.holdUsed||game.targetMode)return;const current=game.active.type;if(game.hold===null){game.hold=current;spawnPiece();}else{const h=game.hold;game.hold=current;game.active=newPiece(game,h);}game.holdUsed=true;sound(280,.06);}
function lockPiece(){if(!game||!game.active)return;const p=game.active,coords=rotateCoords(p.type,p.rot);let placed=[];for(let i=0;i<coords.length;i++){const [cx,cy]=coords[i],x=p.x+cx,y=p.y+cy;if(y<0){finishGame(false,'Une pièce a atteint la zone supérieure.');return;}const kind=p.special&&i===0?p.special:'normal';game.board[y][x]={kind,type:p.type};placed.push([x,y]);}
 game.active=null;const cleared=clearLines();if(cleared>0){game.combo++;game.score+=(BASE_POINTS[cleared]*game.level+50*game.combo)*(game.event?.type==='bonus'?2:1);game.lines+=cleared;if(game.mode!=='classic'){game.energy=clamp(game.energy+ENERGY_GAIN[cleared]+10*game.combo,0,500);}if(game.mode==='daily'){}if(game.mode==='campaign'&&game.mission===4){const damage=[0,1,2,3,5][cleared]||0;game.bossHp=Math.max(0,game.bossHp-damage);if(damage)say(`DÉGÂTS AU BOSS : ${damage}`,1.2);}
 sound(520+cleared*90,.12,'triangle',.045);burst(BOARD_X+CELL*5,BOARD_Y+CELL*14,16);
 }else{game.combo=0;sound(125,.045,'sine',.02);}
 if(game.lines>=game.level*10)game.level=1+Math.floor(game.lines/10);
 if(game.mode==='campaign'&&checkMission()){finishGame(true,'Objectif de mission atteint.');return;}
 if(game.mode==='campaign'&&game.mission===4&&game.bossHp<=0){finishGame(true,'Le Verrou est neutralisé.');return;}
 checkTopOut();if(screen==='playing')spawnPiece();}
function clearLines(){let cleared=0,fullRows=[],explosions=[],crystalCount=0;for(let y=0;y<ROWS;y++){if(game.board[y].every(c=>c!==null)){fullRows.push(y);for(let x=0;x<COLS;x++){const c=game.board[y][x];if(c.kind==='explosive')explosions.push([x,y]);if(c.kind==='crystal')crystalCount++;}}}
 const fullSet=new Set(fullRows);
 // Les explosions touchent les rangées voisines avant le décalage, sans annuler les lignes complètes.
 for(const [ex,ey] of explosions){for(let y=Math.max(0,ey-1);y<=Math.min(ROWS-1,ey+1);y++){if(fullSet.has(y))continue;for(let x=Math.max(0,ex-1);x<=Math.min(COLS-1,ex+1);x++){const c=game.board[y][x];if(c&&c.kind==='normal')game.board[y][x]=null;}}}
 // Rechercher de bas en haut en restant sur l'index après un effacement : la rangée supérieure vient d'y descendre.
 for(let y=ROWS-1;y>=0;){if(game.board[y].every(c=>c!==null)){game.board.splice(y,1);game.board.unshift(Array(COLS).fill(null));cleared++;}else y--;}
 if(crystalCount&&game.mode!=='classic')game.energy=clamp(game.energy+crystalCount*25,0,500);return cleared;}
function checkTopOut(){for(let x=0;x<COLS;x++)if(game.board[0][x]){finishGame(false,'La grille a atteint la limite supérieure.');return;}}
function checkMission(){const m=MISSIONS[game.mission];if(m.type==='lines')return game.lines>=m.target;if(m.type==='score')return game.score>=m.target;if(m.type==='pulse')return game.usedPulse>=m.target;if(m.type==='time')return game.time>=m.target;return false;}
function finishGame(won,reason=''){if(!game||screen==='result')return;game.won=won;game.gameOver=!won;let stars=0;if(won){stars=1;if(game.mission===0&&game.lines>=12)stars++;else if(game.mission===1&&game.score>=4000)stars++;else if(game.mission===2&&game.score>=2500)stars++;else if(game.mission===3&&game.time>=120)stars++;else if(game.mission===4&&game.time<100)stars++;stars=Math.min(3,stars);}
 if(game.mode==='campaign'&&won){save.stars[game.mission]=Math.max(save.stars[game.mission]||0,stars);persist();}
 if(game.mode==='classic'&&game.score>save.classicBest){save.classicBest=game.score;persist();}
 if(game.mode==='survival'&&game.score>save.survivalBest){save.survivalBest=game.score;persist();}
 if(game.mode==='daily'&&game.score>save.dailyBest){save.dailyBest=game.score;persist();}
 resultData={won,reason,stars,score:game.score,lines:game.lines,time:game.time,level:game.level,mission:game.mission,mode:game.mode};screen='result';sound(won?780:90,.22,'triangle',.05);}
function pay(cost){if(game.energy<cost){say('ÉNERGIE INSUFFISANTE');sound(90,.08);return false;}game.energy-=cost;return true;}
function startTarget(mode){if(!game||screen!=='playing')return;if(mode==='pulse'&&game.mode==='classic'){say('POUVOIRS INDISPONIBLES EN CLASSIQUE');return;}if(mode==='stasis'&&game.stasis>0){say('STASE DÉJÀ ACTIVE');return;}if(mode==='shield'&&game.shield){say('BOUCLIER DÉJÀ CHARGÉ');return;}if((mode==='pulse'||mode==='laser')&&game.energy<COST[mode]){say('ÉNERGIE INSUFFISANTE');sound(90,.08);return;}if(mode==='stasis'||mode==='shield'){if(!pay(COST[mode]))return;}if(mode==='stasis'){game.stasis=8;say('STASE ACTIVÉE • 8 SECONDES');sound(650,.13);return;}if(mode==='shield'){game.shield=true;say('BOUCLIER ARMÉ');sound(720,.13);return;}game.targetMode=mode;game.targetX=5;game.targetY=11; say(mode==='pulse'?'CIBLE PULSE • FLÈCHES + ENTRÉE':'CIBLE LASER • ← / → + ENTRÉE');}
function confirmTarget(){if(!game.targetMode)return;const mode=game.targetMode;if(!pay(COST[mode])){game.targetMode=null;return;}if(mode==='pulse'){for(let y=Math.max(0,game.targetY-1);y<=Math.min(ROWS-1,game.targetY+1);y++)for(let x=Math.max(0,game.targetX-1);x<=Math.min(COLS-1,game.targetX+1);x++){const c=game.board[y][x];if(c&&c.kind!=='indestructible'&&c.kind!=='frozen')game.board[y][x]=null;}game.usedPulse++;say('PULSE EXÉCUTÉ');burst(BOARD_X+CELL*(game.targetX+.5),BOARD_Y+CELL*(game.targetY-2+.5),18);}
 else if(mode==='laser'){for(let y=2;y<ROWS;y++){const c=game.board[y][game.targetX];if(c&&c.kind!=='indestructible'&&c.kind!=='frozen')game.board[y][game.targetX]=null;}say(`LASER VERTICAL • COLONNE ${game.targetX+1}`);}
 game.targetMode=null;sound(860,.15,'square',.025);}
function usePower(n){if(n===1)startTarget('pulse');else if(n===2)startTarget('stasis');else if(n===3)startTarget('laser');else if(n===4)startTarget('shield');}
function bossAttack(){if(game.shield){game.shield=false;say('BOUCLIER : ATTAQUE ANNULÉE',2);sound(740,.2,'triangle');return;}game.board.shift();const hole=game.rng()*COLS|0;const row=Array.from({length:COLS},(_,x)=>x===hole?null:{kind:'normal',type:'I'});game.board.push(row);game.shake=.22;say('LE VERROU AJOUTE UNE RANGÉE DE PRESSION',2.4);sound(100,.2,'sawtooth',.035);checkTopOut();}
function update(dt){animT+=dt;if(toastTimer>0)toastTimer-=dt;if(screen!=='playing'||!game)return;game.time+=dt;if(game.stasis>0)game.stasis=Math.max(0,game.stasis-dt);if(game.shake>0)game.shake=Math.max(0,game.shake-dt);if(game.eventBanner>0)game.eventBanner-=dt;
 if(game.mode==='campaign'&&game.mission===4){game.bossClock+=dt;if(game.bossClock>=22){game.bossClock-=22;bossAttack();}game.bossWarning=game.bossClock>=19;}
 if(game.mode==='survival'){game.eventClock+=dt;if(game.eventClock>=34){game.eventClock=0;const ev=[['gravity','GRAVITÉ ACCÉLÉRÉE'],['fog','BROUILLARD NEXUS'],['powerlock','POUVOIRS VERROUILLÉS'],['bonus','SURCHARGE DE SCORE']][rand(4)];game.event={type:ev[0],left:9};game.eventMessage=ev[1];game.eventBanner=2.5;}if(game.event){game.event.left-=dt;if(game.event.left<=0)game.event=null;}}
 const held=game.held;game.moveClock-=dt;if(!game.targetMode&&game.moveClock<=0){if(held.left){tryMove(-1,0);game.moveClock=.12;}else if(held.right){tryMove(1,0);game.moveClock=.12;}}
 const speed=dropInterval();let fall=speed;if(held.down)fall=game.event?.type==='gravity'?.035:.045;game.dropClock+=dt;if(game.dropClock>=fall){game.dropClock=0;if(held.down)softStep();else if(valid(game.active,game.active.x,game.active.y+1,game.active.rot))game.active.y++;else lockPiece();}
 if(game.mode==='campaign'&&checkMission()&&screen==='playing')finishGame(true,'Objectif de mission atteint.');}
function dropInterval(){let ms=Math.max(100,800-55*(game.level-1));let sec=ms/1000;if(game.stasis>0)sec*=2;if(game.event?.type==='gravity')sec*=.55;return sec;}
function say(s,t=1.8){toast=s;toastTimer=t;}
function burst(x,y,n){if(!game||save.options.reduced)return;for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=25+Math.random()*120;game.particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:.35+Math.random()*.5,max:.85});}}
function updateParticles(dt){if(!game)return;for(const p of game.particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.98;p.vy*=.98;p.life-=dt;}game.particles=game.particles.filter(p=>p.life>0);}
function keyDown(e){const k=e.key.toLowerCase();if(['arrowleft','arrowright','arrowdown','arrowup',' ','escape'].includes(k))e.preventDefault();if(screen==='menu'){if(k==='arrowdown'||k==='s')menuIndex=(menuIndex+1)%4;else if(k==='arrowup'||k==='w')menuIndex=(menuIndex+3)%4;else if(k==='enter')menuAction(menuIndex);return;}
 if(screen==='modes'){if(k==='arrowdown'||k==='s')modeIndex=(modeIndex+1)%5;else if(k==='arrowup'||k==='w')modeIndex=(modeIndex+4)%5;else if(k==='enter')chooseMode(modeIndex);else if(k==='escape')screen='menu';return;}
 if(screen==='campaign'){if(k==='escape')screen='modes';else if(k==='arrowleft')missionIndex=Math.max(0,missionIndex-1);else if(k==='arrowright')missionIndex=Math.min(4,missionIndex+1);else if(k==='enter')startMission(missionIndex);return;}
 if(screen==='options'){if(k==='escape'||k==='enter')screen='menu';else if(k==='arrowup')optionIndex=(optionIndex+4)%5;else if(k==='arrowdown')optionIndex=(optionIndex+1)%5;else if(k===' '||k==='enter')changeOption(optionIndex);else if(k==='arrowleft')adjustOption(optionIndex,-.1);else if(k==='arrowright')adjustOption(optionIndex,.1);return;}
 if(screen==='records'||screen==='credits'){if(k==='escape'||k==='enter'||k===' ')screen='menu';return;}
 if(screen==='paused'){if(k==='escape'||k==='p')screen='playing';else if(k==='r')newGame(game.mode,game.mission);else if(k==='m'){game=null;screen='menu';}return;}
 if(screen==='result'){if(k==='enter'){if(resultData.mode==='campaign'&&resultData.won&&resultData.mission<4)startMission(resultData.mission+1);else if(resultData.mode==='campaign')screen='campaign';else newGame(resultData.mode);}else if(k==='escape')screen=resultData.mode==='campaign'?'campaign':'menu';return;}
 if(screen!=='playing'||!game)return;
 if(game.targetMode){if(k==='arrowleft')game.targetX=clamp(game.targetX-1,0,COLS-1);else if(k==='arrowright')game.targetX=clamp(game.targetX+1,0,COLS-1);else if(k==='arrowup')game.targetY=clamp(game.targetY-1,2,ROWS-1);else if(k==='arrowdown')game.targetY=clamp(game.targetY+1,2,ROWS-1);else if(k==='enter')confirmTarget();else if(k==='escape'){game.targetMode=null;say('CIBLAGE ANNULÉ');}return;}

function drawPause(){drawGame();ctx.fillStyle='#03060dcc';ctx.fillRect(0,0,W,H);rr(420,190,440,360,18,'#0b1425','#315b94',2);text('PAUSE',640,250,32,C.white,900,'center');text('La partie est suspendue.',640,290,13,C.muted,500,'center');button(470,320,340,52,'REPRENDRE','',true);button(470,390,340,52,'RECOMMENCER');button(470,460,340,52,'QUITTER LA PARTIE');text('ÉCHAP / P : REPRENDRE',640,530,10,C.muted,600,'center');}
function drawResult(){drawBackground();rr(350,90,580,550,20,'#0c1628','#315b94',2);text(resultData.won?'MISSION ACCOMPLIE':'PARTIE TERMINÉE',640,155,31,C.white,900,'center');text(resultData.won?'Le Nexus retrouve son équilibre.':'La grille ne peut plus continuer.',640,197,14,C.muted,500,'center');if(resultData.mode==='campaign'&&resultData.won){for(let i=0;i<3;i++)star(595+i*45,260,i<resultData.stars?C.blue2:'#2b3b55',13);text(`${resultData.stars} / 3 ÉTOILES`,640,295,12,C.blue3,800,'center');}
 const stats=[['SCORE',resultData.score.toLocaleString('fr-FR')],['LIGNES',resultData.lines],['NIVEAU',resultData.level],['DURÉE',formatTime(resultData.time)]];stats.forEach((s,i)=>{const x=440+(i%2)*220,y=355+Math.floor(i/2)*64;label(s[0],x,y);text(s[1],x,y+24,20,C.white,800);});text(resultData.reason,640,495,12,C.muted,600,'center');button(465,530,350,48,resultData.mode==='campaign'?(resultData.won&&resultData.mission<4?'MISSION SUIVANTE':'CARTE DE CAMPAGNE'):'REJOUER','',true);text('ÉCHAP : MENU / CARTE',640,604,10,C.muted,600,'center');}
function mobileBg(){const g=ctx.createLinearGradient(0,0,720,mobileH);g.addColorStop(0,'#101e38');g.addColorStop(.48,'#070e1c');g.addColorStop(1,'#03060d');ctx.fillStyle=g;ctx.fillRect(0,0,720,mobileH);ctx.save();ctx.globalAlpha=.14;ctx.strokeStyle='#3276cf';ctx.lineWidth=1;for(let x=0;x<720;x+=48){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,mobileH);ctx.stroke();}for(let y=0;y<mobileH;y+=48){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(720,y);ctx.stroke();}ctx.restore();}
function mt(str,x,y,size=20,color=C.white,weight=700,align='left'){ctx.fillStyle=color;ctx.font=`${weight} ${size}px Inter,Segoe UI,Arial`;ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillText(String(str),x,y);}
function mpanel(x,y,w,h,fill='#0b172b',stroke='#28466d'){ctx.beginPath();ctx.roundRect(x,y,w,h,18);ctx.fillStyle=fill;ctx.fill();ctx.lineWidth=1.5;ctx.strokeStyle=stroke;ctx.stroke();}
function mbutton(x,y,w,h,title,sub,id,active=false){mpanel(x,y,w,h,active?'#12366b':'#101e34',active?'#69a8ff':'#2a4366');ctx.save();ctx.globalAlpha=.22;ctx.fillStyle='#77adff';ctx.fillRect(x+2,y+2,w-4,4);ctx.restore();mt(title,x+w/2,y+(sub?h*.42:h*.52),Math.min(24,w/Math.max(5,title.length)*1.35),C.white,800,'center');if(sub)mt(sub,x+w/2,y+h*.75,13,C.muted,500,'center');mobileHitAreas.push({x,y,w,h,id});}
function mobileHeader(title,sub=''){mt('TETRIS',30,49,25,C.white,900);mt('NEXUS',135,49,25,C.blue2,900);mt(title.toUpperCase(),30,112,28,C.white,900);if(sub)mt(sub,30,151,14,C.muted,500);}
function drawMobileMenu(){mobileBg();mobileHitAreas=[];mt('TETRIS',360,250,66,C.white,900,'center');mt('NEXUS',360,320,66,C.blue2,900,'center');mt('PUZZLE ARCADE • ÉDITION NEXUS',360,390,15,C.blue3,800,'center');mt('CONSTRUIRE  •  SURVIVRE  •  MAÎTRISER',360,435,13,C.muted,600,'center');const items=[['JOUER','Choisir un mode de jeu','menuPlay'],['OPTIONS','Son et préférences','menuOptions'],['RECORDS','Vos meilleures performances','menuRecords'],['CRÉDITS','À propos du projet','menuCredits']];items.forEach((it,i)=>mbutton(55,530+i*132,610,104,it[0],it[1],it[2],i===0));mt('VERSION 1.2  •  COMMANDES TACTILES',360,mobileH-70,12,C.muted,600,'center');}
function drawMobileModes(){mobileBg();mobileHitAreas=[];mobileHeader('Choisir un mode','Sélectionnez votre expérience de jeu.');const items=[['CLASSIQUE','Le Tetris pur, sans pouvoirs'],['CAMPAGNE NEXUS','Missions, énergie et boss'],['SURVIE','Événements et blocs spéciaux'],['DÉFI QUOTIDIEN','Un défi renouvelé chaque jour'],['RETOUR','Revenir au menu']];items.forEach((it,i)=>mbutton(35,245+i*140,650,112,it[0],it[1],`mode${i}`,i===modeIndex));}
function drawMobileCampaign(){mobileBg();mobileHitAreas=[];mobileHeader('Campagne Nexus','Secteur 01 — Éveil • Progressez mission après mission.');for(let i=0;i<5;i++){const y=240+i*220,unlocked=i===0||save.stars[i-1]>0;mpanel(35,y,650,190, i===missionIndex?'#102a50':'#0b1729',i===missionIndex?C.blue2:'#263d5c');mt(`0${i+1}`,75,y+48,31,unlocked?C.blue3:'#61728a',900);mt(i===4?'BOSS':MISSIONS[i].name,160,y+45,22,C.white,800);mt(MISSIONS[i].goal,160,y+88,14,C.muted,500);for(let j=0;j<3;j++)star(175+j*34,y+140,j<(save.stars[i]||0)?C.gold2:'#263751',9);mt(unlocked?'OUVRIR':'VERROUILLÉE',570,y+143,13,unlocked?C.blue3:'#718198',800,'center');mobileHitAreas.push({x:35,y,w:650,h:190,id:`mission${i}`});}}
function drawMobileOptions(){mobileBg();mobileHitAreas=[];mobileHeader('Options','Touchez une ligne pour modifier les paramètres.');const opts=[['EFFETS SONORES',save.options.sfx?'ACTIVÉS':'DÉSACTIVÉS'],['VOLUME DES EFFETS',`${Math.round(save.options.sfxVolume*100)} %`],['AMBIANCE MUSICALE',save.options.music?'ACTIVÉE':'DÉSACTIVÉE'],['VOLUME MUSICAL',`${Math.round(save.options.musicVolume*100)} %`],['RÉDUIRE LES ANIMATIONS',save.options.reduced?'ACTIVÉ':'DÉSACTIVÉ']];opts.forEach((o,i)=>{const y=260+i*142;mpanel(35,y,650,108);mt(o[0],65,y+38,16,C.white,800);mt(o[1],650,y+77,16,(i===1||i===3)?C.gold2:C.blue3,800,'right');if(i===1||i===3){const val=i===1?save.options.sfxVolume:save.options.musicVolume;mpanel(65,y+68,340,12,'#1b2b45','#1b2b45');mpanel(65,y+68,Math.max(12,340*val),12,C.gold,C.gold);}mobileHitAreas.push({x:35,y,w:650,h:108,id:`option${i}`});});mbutton(35,mobileH-150,650,84,'RETOUR AU MENU','', 'backMenu');}
function drawMobileRecords(){mobileBg();mobileHitAreas=[];mobileHeader('Records','Vos meilleures performances.');const vals=[['CLASSIQUE',save.classicBest],['SURVIE',save.survivalBest],['DÉFI QUOTIDIEN',save.dailyBest]];vals.forEach((v,i)=>{const y=300+i*155;mpanel(35,y,650,115);mt(v[0],70,y+42,17,C.muted,800);mt(Number(v[1]).toLocaleString('fr-FR'),650,y+78,29,C.white,900,'right');});mt('ÉTOILES DE CAMPAGNE',360,900,15,C.blue3,800,'center');mt(`${save.stars.reduce((a,b)=>a+b,0)} / 15`,360,950,34,C.white,900,'center');mbutton(35,mobileH-150,650,84,'RETOUR AU MENU','','backMenu');}
function drawMobileCredits(){mobileBg();mobileHitAreas=[];mobileHeader('Crédits');mt('TETRIS',360,390,55,C.white,900,'center');mt('NEXUS',360,455,55,C.blue2,900,'center');mt('Un puzzle arcade réinventé.',360,560,22,C.white,700,'center');mt('Édition autonome navigateur',360,610,16,C.muted,500,'center');mt('Grille 10 × 20 • Capacités • Missions',360,655,14,C.muted,500,'center');mbutton(35,mobileH-150,650,84,'RETOUR AU MENU','','backMenu');}
function drawMobileBoard(cell,bx,by){const bw=COLS*cell,bh=VISIBLE*cell;mpanel(bx-10,by-10,bw+20,bh+20,'#050a14','#2b4a72');ctx.fillStyle='#080f1c';ctx.fillRect(bx,by,bw,bh);for(let y=0;y<VISIBLE;y++)for(let x=0;x<COLS;x++){const px=bx+x*cell,py=by+y*cell;ctx.strokeStyle='#203451';ctx.lineWidth=1;ctx.strokeRect(px,py,cell,cell);const block=game.board[y+2][x];if(block)drawBlock(px,py,cell-1,blockColor(block),block.kind);}const p=game.active;if(p){const coords=rotateCoords(p.type,p.rot),gy=ghostY();for(const [cx,cy] of coords){const x=p.x+cx,y=gy+cy;if(y>=2)drawBlock(bx+x*cell,by+(y-2)*cell,cell-1,C.blue2,null,true);}for(const [cx,cy] of coords){const x=p.x+cx,y=p.y+cy;if(y>=2)drawBlock(bx+x*cell,by+(y-2)*cell,cell-1,PIECE_COLORS[p.type]);}}if(game.targetMode){const ty=game.targetY-2;ctx.save();ctx.strokeStyle=C.gold2;ctx.lineWidth=3;ctx.setLineDash([7,5]);if(game.targetMode==='pulse')ctx.strokeRect(bx+(game.targetX-1)*cell,by+(ty-1)*cell,cell*3,cell*3);else ctx.strokeRect(bx+game.targetX*cell,by,cell,bh);ctx.restore();}}
function drawMobilePlaying(){mobileBg();mobileHitAreas=[];const mode=game.mode==='classic'?'CLASSIQUE':game.mode==='campaign'?`CAMPAGNE • MISSION ${game.mission+1}`:game.mode==='survival'?'SURVIE':'DÉFI QUOTIDIEN';mt('TETRIS NEXUS',28,42,22,C.white,900);mt(mode,28,78,13,C.blue3,800);mbutton(605,20,85,72,'Ⅱ','PAUSE','pauseGame');const cards=[['SCORE',game.score.toLocaleString('fr-FR')],['NIVEAU',game.level],['LIGNES',game.lines]];cards.forEach((v,i)=>{const x=25+i*228;mpanel(x,112,215,105,'#0d1b30','#28466d');mt(v[0],x+18,143,12,C.muted,800);mt(v[1],x+18,184,26,C.white,900);});const cell=Math.max(25,Math.min(45,(mobileH-625)/20));const bx=(720-COLS*cell)/2,by=245;drawMobileBoard(cell,bx,by);const bottom=by+VISIBLE*cell;mpanel(35,bottom+24,650,43,'#0d1a2e','#263f62');mt(`RECORD  ${recordForMode().toLocaleString('fr-FR')}     TEMPS  ${formatTime(game.time)}     ${game.combo?`COMBO ×${game.combo}`:''}`,360,bottom+46,13,C.blue3,700,'center');let y=bottom+80;
 if(game.targetMode){mbutton(34,y,205,74,'←','CIBLE','targetLeft');mbutton(257,y,205,74,'VALIDER','CONFIRMER','targetConfirm',true);mbutton(480,y,205,74,'→','CIBLE','targetRight');mbutton(34,y+84,205,68,'↑','MONTER','targetUp');mbutton(257,y+84,205,68,'ANNULER','','targetCancel');mbutton(480,y+84,205,68,'↓','DESCENDRE','targetDown');return;}
 // Main arcade controls: large hit targets sized for thumbs.
 mbutton(22,y,108,84,'◀','GAUCHE','left');mbutton(142,y,108,84,'▼','DESCENDRE','down');mbutton(262,y,108,84,'▶','DROITE','right');mbutton(397,y,135,84,'⟳','TOURNER','rotate',true);mbutton(542,y,156,84,'⇩','CHUTE RAPIDE','drop',true);
 y+=94;mbutton(40,y,150,76,'RÉSERVE','HOLD','hold');mbutton(205,y,150,76,'↶','ROTATION −','rotateBack');if(game.mode!=='classic'){const powers=[['PULSE','1'],['STASE','2'],['LASER','3'],['BOUCLIER','4']];powers.forEach((v,i)=>{const x=370+(i%2)*166,yy=y+Math.floor(i/2)*84;mbutton(x,yy,150,76,v[0],`${COST[['pulse','stasis','laser','shield'][i]]} É` ,`power${i+1}`,game.energy>=COST[['pulse','stasis','laser','shield'][i]]);});}
 else mt('TOUCHES : GAUCHE / DROITE • TOURNER • CHUTE RAPIDE',360,y+100,12,C.muted,600,'center');
 if(game.mode!=='classic'){mt(`ÉNERGIE  ${game.energy} / 500`,360,mobileH-35,13,C.gold2,800,'center');}}
function drawMobilePaused(){drawMobilePlaying();ctx.fillStyle='#020611dc';ctx.fillRect(0,0,720,mobileH);mobileHitAreas=[];mpanel(45,mobileH*.34,630,510,'#0c192c','#4777b3');mt('PAUSE',360,mobileH*.34+90,38,C.white,900,'center');mt('Votre partie est suspendue.',360,mobileH*.34+145,17,C.muted,500,'center');mbutton(95,mobileH*.34+205,530,82,'REPRENDRE','','resumeGame',true);mbutton(95,mobileH*.34+310,530,82,'RECOMMENCER','','restartGame');mbutton(95,mobileH*.34+415,530,82,'QUITTER LA PARTIE','','quitGame');}
function drawMobileResult(){mobileBg();mobileHitAreas=[];mpanel(35,mobileH*.23,650,690,'#0c192c','#4777b3');mt(resultData.won?'MISSION ACCOMPLIE':'PARTIE TERMINÉE',360,mobileH*.23+90,30,C.white,900,'center');mt(resultData.won?'Le Nexus retrouve son équilibre.':'La grille ne peut plus continuer.',360,mobileH*.23+145,15,C.muted,500,'center');const vals=[['SCORE',resultData.score.toLocaleString('fr-FR')],['LIGNES',resultData.lines],['NIVEAU',resultData.level],['DURÉE',formatTime(resultData.time)]];vals.forEach((v,i)=>{const x=100+(i%2)*280,y=mobileH*.23+240+Math.floor(i/2)*110;mt(v[0],x,y,13,C.muted,800);mt(v[1],x,y+40,25,C.white,900);});mt(resultData.reason,360,mobileH*.23+480,13,C.muted,600,'center');mbutton(95,mobileH*.23+535,530,85,resultData.mode==='campaign'?(resultData.won&&resultData.mission<4?'MISSION SUIVANTE':'CARTE DE CAMPAGNE'):'REJOUER','','resultAction',true);mbutton(95,mobileH*.23+640,530,75,'RETOUR AU MENU','','resultMenu');}
function drawMobileScreen(){if(screen==='menu')drawMobileMenu();else if(screen==='modes')drawMobileModes();else if(screen==='campaign')drawMobileCampaign();else if(screen==='options')drawMobileOptions();else if(screen==='records')drawMobileRecords();else if(screen==='credits')drawMobileCredits();else if(screen==='playing')drawMobilePlaying();else if(screen==='paused')drawMobilePaused();else if(screen==='result')drawMobileResult();}
function mobileSetHeld(){if(!game)return;const a=[...activeTouchControls.values()];game.held.left=a.includes('left');game.held.right=a.includes('right');game.held.down=a.includes('down');}
function onMobilePointerDown(e){e.preventDefault();canvas.focus();try{canvas.setPointerCapture(e.pointerId);}catch(_){}const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*720,y=(e.clientY-r.top)/r.height*mobileH;const hit=[...mobileHitAreas].reverse().find(a=>x>=a.x&&x<=a.x+a.w&&y>=a.y&&y<=a.y+a.h);if(!hit)return;const id=hit.id;
 if(['left','right','down'].includes(id)){activeTouchControls.set(e.pointerId,id);mobileSetHeld();if(id==='left')tryMove(-1,0);if(id==='right')tryMove(1,0);if(game)game.moveClock=.14;return;}
 if(id==='menuPlay')menuAction(0);else if(id==='menuOptions')menuAction(1);else if(id==='menuRecords')menuAction(2);else if(id==='menuCredits')menuAction(3);
 else if(id.startsWith('mode'))chooseMode(Number(id.slice(4)));else if(id.startsWith('mission'))startMission(Number(id.slice(7)));else if(id.startsWith('option')){const i=Number(id.slice(6));if(i===1||i===3){adjustOption(i,x<360?-.1:.1);}else changeOption(i);}
 else if(id==='backMenu')screen='menu';else if(id==='pauseGame'&&screen==='playing')screen='paused';else if(id==='resumeGame')screen='playing';else if(id==='restartGame')newGame(game.mode,game.mission);else if(id==='quitGame'){game=null;screen='menu';}
 else if(id==='rotate')tryRotate(1);else if(id==='rotateBack')tryRotate(-1);else if(id==='drop')hardDrop();else if(id==='hold')holdPiece();else if(id.startsWith('power'))usePower(Number(id.slice(5)));
 else if(id==='targetLeft')game.targetX=clamp(game.targetX-1,0,COLS-1);else if(id==='targetRight')game.targetX=clamp(game.targetX+1,0,COLS-1);else if(id==='targetUp')game.targetY=clamp(game.targetY-1,2,ROWS-1);else if(id==='targetDown')game.targetY=clamp(game.targetY+1,2,ROWS-1);else if(id==='targetConfirm')confirmTarget();else if(id==='targetCancel'){game.targetMode=null;say('CIBLAGE ANNULÉ');}
 else if(id==='resultAction'){if(resultData.mode==='campaign'&&resultData.won&&resultData.mission<4)startMission(resultData.mission+1);else if(resultData.mode==='campaign')screen='campaign';else newGame(resultData.mode);}else if(id==='resultMenu'){screen=resultData.mode==='campaign'?'campaign':'menu';}}
function onMobilePointerUp(e){if(activeTouchControls.has(e.pointerId)){activeTouchControls.delete(e.pointerId);mobileSetHeld();}}
function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);if(mobilePortrait){drawMobileScreen();return;}if(screen==='menu')drawMenu();else if(screen==='modes')drawModes();else if(screen==='campaign')drawCampaign();else if(screen==='options')drawOptions();else if(screen==='records')drawRecords();else if(screen==='credits')drawCredits();else if(screen==='playing')drawGame();else if(screen==='paused')drawPause();else if(screen==='result')drawResult();}
function frame(now){const dt=Math.min(.05,(now-lastFrame)/1000||0);lastFrame=now;update(dt);if(screen==='playing')updateParticles(dt);draw();requestAnimationFrame(frame);}
requestAnimationFrame(frame);
// Keep the browser canvas focused for keyboard play and resume audio after the first gesture.
canvas.addEventListener('pointerdown',()=>{canvas.focus();if(save.options.music){if(!musicNodes)toggleMusic(true);else if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();}},{passive:true});
window.addEventListener('keydown',()=>{if(save.options.music&&audioCtx&&audioCtx.state==='suspended')audioCtx.resume();},{passive:true});
})();
